<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>cur8bit</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

  <div class="site-header-info">
    <h1>
      <a class="site-title" href="index.html">cur8bit</a>
    </h1>

    <p class="site-description">
      scythe’s Recommended Chiptune Collection.<br/>
      scytheの個人的おすすめチップチューン一覧。オリジナル作品に限ります。
    </p>
  </div>

  <nav>
    <a href="index.html">Releases</a>
    <a href="artists.html">Artists</a>
  </nav>

</header>

<main>
  <h2>Releases</h2>

 <div id="filters">

    <select id="artist-filter">
      <option value="all">All Artists</option>
    </select>

    <select id="country-filter">
      <option value="all">All Countries</option>
    </select>

    <select id="vocal-filter">
      <option value="all">All Vocals</option>
      <option value="yes">Vocal</option>
      <option value="no">Instrumental</option>
    </select>

    <select id="sort-select">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="artist">Artist</option>
      <option value="title">Title</option>
    </select>

  </div>

  <div id="release-grid"></div>

</main>

  <script src="js/app.js"></script>
</body>
</html>
